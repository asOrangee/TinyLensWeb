when coherent extended interior emission visibly continues into a clipped boundary; edge-flux
metrics are continuous supporting evidence, not an automatic threshold. The only repair targets
are `stage_m3_n_live` and `stage_m3_n_eff`; source-grid truncation and prior truncation have no
M3-local repair and never trigger automatic upstream rollback. If clipping cannot be distinguished
from a boundary-only pathology, report `scientific_uncertainty`; it routes to Human Review.
"""
