[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-lens-model"
version = "0.1.0"
description = "Codex-orchestrated, stage-gated strong-lens modeling"
requires-python = ">=3.11"
dependencies = [
  "astropy>=5.0",
  "jsonschema>=4.0",
  "matplotlib>=3.5",
  "numpy>=1.24",
  "photutils>=1.9",
  "pydantic>=2.7",
  "scipy>=1.9",
]

[project.scripts]
lens-agent = "lens_agent.cli:main"
lens-inspector-eval = "lens_agent.evaluation.system_inspector:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
